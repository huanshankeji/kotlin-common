name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Inlined from huanshankeji/.github/.github/workflows/gradle-ci.yml@v0.4.0 so we can
  # set cache-read-only: false and add caches that setup-gradle@v6 does not cover.
  check:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDKs
        uses: huanshankeji/.github/actions/setup-javas@v0.4.0
        with:
          jdk-versions: 11-temurin, 17-temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Encrypts on-disk configuration-cache entries (needed when we cache that directory).
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Write Gradle User Home / build-cache entries from every branch.
          cache-read-only: false

      # setup-gradle caches ~/.gradle but not ~/.konan (Kotlin/Native compiler + LLVM deps).
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'buildSrc/build.gradle.kts', 'gradle/classpath-bootstrap.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      # setup-gradle@v6 removed configuration-cache persistence. Gradle stores entries under
      # .gradle/configuration-cache in the checkout. buildSrc/build must also be restored or
      # configuration-cache reuse fails when buildSrc task inputs appear to have changed.
      - name: Cache Gradle configuration cache and buildSrc
        uses: actions/cache@v4
        with:
          path: |
            .gradle/configuration-cache
            buildSrc/build
          key: ${{ runner.os }}-${{ runner.arch }}-configcache-check-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'buildSrc/**/*.kt', 'gradle/classpath-bootstrap.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-configcache-check-

      - name: Check with Gradle Wrapper
        env:
          # GPR_* (PAT, read:packages): resolve Gradle/Maven dev artifacts from another repo's GitHub
          # Packages registry (e.g. kotlin-common pulling huanshankeji/gradle-common). GITHUB_TOKEN is
          # repo-scoped; Maven/Gradle packages have no cross-repo "Manage Actions access" UI.
          # https://github.com/huanshankeji/gradle-common/pull/65
          ORG_GRADLE_PROJECT_gprUser: ${{ secrets.GPR_USER }}
          ORG_GRADLE_PROJECT_gprKey: ${{ secrets.GPR_KEY }}
        shell: bash
        run: |
          ./gradlew check 2>&1 | tee build.log
          echo "**Configuration cache:** $(grep -m1 -E 'Reusing configuration cache|Calculating task graph' build.log || echo 'signal not found')" >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'Downloading dependency .*konan\|downloadKotlinNativeDistribution' build.log; then
            echo "**Kotlin/Native:** downloaded toolchain or deps this run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Kotlin/Native:** no konan download lines (likely cache hit)" >> "$GITHUB_STEP_SUMMARY"
          fi

  dependency-submission:
    if: github.ref == 'refs/heads/main'
    # It seems sufficient to run dependency submission for Kotlin Multiplatform on Ubuntu instead of macOS.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDKs
        uses: huanshankeji/.github/actions/setup-javas@v0.4.0
        with:
          jdk-versions: 11-temurin, 17-temurin

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        env:
          # Same as check job — https://github.com/huanshankeji/gradle-common/pull/65
          ORG_GRADLE_PROJECT_gprUser: ${{ secrets.GPR_USER }}
          ORG_GRADLE_PROJECT_gprKey: ${{ secrets.GPR_KEY }}
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
