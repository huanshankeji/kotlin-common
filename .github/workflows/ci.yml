name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Inlined from huanshankeji/.github/.github/workflows/gradle-ci.yml@v0.4.0 so we can
  # set cache-read-only: false. The shared setup-javas-and-gradle action omits that input,
  # so feature-branch runs default to read-only and never persist build/configuration cache.
  check:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDKs
        uses: huanshankeji/.github/actions/setup-javas@v0.4.0
        with:
          jdk-versions: 11-temurin, 17-temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Persist configuration-cache data across CI runs.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Write cache entries from every branch so successive commits reuse build outputs.
          cache-read-only: false

      - name: Check with Gradle Wrapper
        env:
          # GPR_* (PAT, read:packages): resolve Gradle/Maven dev artifacts from another repo's GitHub
          # Packages registry (e.g. kotlin-common pulling huanshankeji/gradle-common). GITHUB_TOKEN is
          # repo-scoped; Maven/Gradle packages have no cross-repo "Manage Actions access" UI.
          # https://github.com/huanshankeji/gradle-common/pull/65
          ORG_GRADLE_PROJECT_gprUser: ${{ secrets.GPR_USER }}
          ORG_GRADLE_PROJECT_gprKey: ${{ secrets.GPR_KEY }}
        shell: bash
        run: ./gradlew check

  dependency-submission:
    if: github.ref == 'refs/heads/main'
    # It seems sufficient to run dependency submission for Kotlin Multiplatform on Ubuntu instead of macOS.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDKs
        uses: huanshankeji/.github/actions/setup-javas@v0.4.0
        with:
          jdk-versions: 11-temurin, 17-temurin

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        env:
          # Same as check job — https://github.com/huanshankeji/gradle-common/pull/65
          ORG_GRADLE_PROJECT_gprUser: ${{ secrets.GPR_USER }}
          ORG_GRADLE_PROJECT_gprKey: ${{ secrets.GPR_KEY }}
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
